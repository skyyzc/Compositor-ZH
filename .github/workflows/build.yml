name: Chinese preview
on:
  push:
    branches: [main]
    paths: ['scripts/**', 'tests/**', 'translations/**', 'upstream.json', '.github/workflows/build.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chinese-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch pinned official source
        run: python3 scripts/fetch-source.py
      - name: Verify localization boundaries
        run: python3 -m unittest discover -s tests
      - name: Build Chinese preview
        run: python3 scripts/build.py
      - name: Run affected upstream unit suites on localized app
        run: >
          xcodebuild test
          -project build-source/Compositor.xcodeproj
          -scheme Compositor
          -destination 'platform=macOS,arch=arm64'
          -configuration Debug
          -derivedDataPath build-regression
          -resultBundlePath dist/Regression.xcresult
          CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=
          GCC_OPTIMIZATION_LEVEL=s SWIFT_OPTIMIZATION_LEVEL=-O
          -only-testing:CompositorTests/ChannelPackTests
          -only-testing:CompositorTests/FontMenuFacesTests
          -only-testing:CompositorTests/KeyboardShortcutTests
          -only-testing:CompositorTests/ShapeToolTests
          -only-testing:CompositorTests/PSDArtboardTests
          -only-testing:CompositorTests/FilterLayerTests
          -only-testing:CompositorTests/FilterTests
          -only-testing:CompositorTests/GIFLayerTests
          -only-testing:CompositorTests/GIFPreviewPlaybackTests
          -only-testing:CompositorTests/LensEffectsTests
          -only-testing:CompositorTests/ToolRailTests
          -only-testing:CompositorTests/GroupTests
          -only-testing:CompositorTests/ProjectTests
          -only-testing:CompositorTests/AdjustmentLayerTests
          -only-testing:CompositorTests/AdjustmentCacheTests
          -only-testing:CompositorTests/GPUCanvasTests
          -only-testing:CompositorTests/CropTests
          -only-testing:CompositorTests/LayerAlignTests
          -only-testing:CompositorTests/FloatingPanelTests
          -only-testing:CompositorTests/RimLightTests
      - name: Package preview
        run: |
          mkdir -p dist
          cp LICENSE 'build/Build/Products/Debug/Compositor 中文.app/Contents/Resources/UPSTREAM-LICENSE.txt'
          codesign --force --deep --sign - 'build/Build/Products/Debug/Compositor 中文.app'
          codesign --verify --deep --strict 'build/Build/Products/Debug/Compositor 中文.app'
          ditto -c -k --sequesterRsrc --keepParent 'build/Build/Products/Debug/Compositor 中文.app' dist/Compositor-ZH-preview.zip
          shasum -a 256 dist/Compositor-ZH-preview.zip > dist/SHA256SUMS.txt
          cp translation-status.json dist/
      - uses: actions/upload-artifact@v4
        with:
          name: Compositor-ZH-preview
          path: |
            dist/*.zip
            dist/*.txt
            dist/*.json
          retention-days: 14
      - name: Upload translation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: translation-report
          path: translation-status.json
          if-no-files-found: ignore
      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-results
          path: dist/Regression.xcresult
          if-no-files-found: ignore
          retention-days: 14
